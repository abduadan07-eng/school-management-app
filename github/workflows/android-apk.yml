name: Build School Management APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project
        run: |
          set -e
          test -f pubspec.yaml
          test -f lib/main.dart
          test -f lib/features/authentication/account_type_screen.dart
          test -f lib/features/authentication/login_screen.dart
          test -f lib/features/super_admin/super_admin_dashboard_screen.dart
          echo "Project structure verified."

      - name: Generate Android project files
        run: |
          flutter create . --platforms=android --org=com.schoolmanagement

          # Remove Flutter's default test because this app
          # does not use the default MyApp class.
          rm -f test/widget_test.dart

          test ! -e test/widget_test.dart

      - name: Get dependencies
        run: |
          flutter pub get

      - name: Analyze Dart code
        run: |
          flutter analyze

      - name: Run tests
        run: |
          flutter test

      - name: Build release APK
        run: |
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
