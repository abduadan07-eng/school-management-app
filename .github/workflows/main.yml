name: School Management APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -path './.git' -prune -o \
            -type f \
            -iname '*.zip' \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf app_source
          mkdir -p app_source

          unzip -q "$ZIP_FILE" -d app_source

      - name: Locate Flutter project
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find app_source \
            -type f \
            -name 'pubspec.yaml' \
            -print | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml not found."
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")

          test -f "$APP_DIR/lib/main.dart"

          echo "Flutter project: $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Prepare Android
        shell: bash
        run: |
          set -e

          cd "$APP_DIR"

          if [ ! -d android ]; then
            flutter create . \
              --platforms=android \
              --org=com.schoolmanagement
          fi

      - name: Install dependencies
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Analyze application code
        shell: bash
        run: |
          set -e

          cd "$APP_DIR"

          flutter analyze lib

      - name: Build Release APK
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -e

          cd "$APP_DIR"

          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://syspfaiggqoopcyrxqvg.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "===================================="
          echo "APK BUILD SUCCESSFUL"
          echo "===================================="

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
