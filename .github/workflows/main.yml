name: School Management APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 3. Find Flutter project or ZIP
      - name: Prepare project
        shell: bash
        run: |
          set -e

          rm -rf app_source
          mkdir -p app_source

          # First: check if pubspec.yaml already exists
          DIRECT_PUBSPEC=$(find . \
            -path "./.git" -prune -o \
            -type f \
            -name "pubspec.yaml" \
            -print -quit)

          if [ -n "$DIRECT_PUBSPEC" ]; then
            echo "Flutter project found directly in repository."

            DIRECT_DIR=$(dirname "$DIRECT_PUBSPEC")

            if [ "$DIRECT_DIR" = "." ]; then
              echo "APP_DIR=." >> "$GITHUB_ENV"
            else
              cp -r "$DIRECT_DIR"/. app_source/
              echo "APP_DIR=app_source" >> "$GITHUB_ENV"
            fi

          else
            # Find ANY ZIP file
            ZIP_FILE=$(find . \
              -path "./.git" -prune -o \
              -type f \
              -iname "*.zip" \
              -print -quit)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Flutter project and no ZIP file found."
              echo "Please upload the project ZIP to the repository."
              exit 1
            fi

            echo "ZIP found: $ZIP_FILE"

            unzip -q "$ZIP_FILE" -d app_source

            PUBSPEC=$(find app_source \
              -type f \
              -name "pubspec.yaml" \
              -print -quit)

            if [ -z "$PUBSPEC" ]; then
              echo "ERROR: pubspec.yaml was not found inside the ZIP."
              exit 1
            fi

            PROJECT_DIR=$(dirname "$PUBSPEC")

            if [ "$PROJECT_DIR" = "app_source" ]; then
              echo "APP_DIR=app_source" >> "$GITHUB_ENV"
            else
              echo "APP_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
            fi
          fi

      # 4. Verify Flutter project
      - name: Verify project
        shell: bash
        run: |
          set -e

          echo "Project directory:"
          echo "$APP_DIR"

          test -f "$APP_DIR/pubspec.yaml"
          test -f "$APP_DIR/lib/main.dart"

          echo "Flutter project verified successfully."

      # 5. Generate Android files if missing
      - name: Prepare Android
        shell: bash
        run: |
          set -e

          cd "$APP_DIR"

          if [ ! -d "android" ]; then
            echo "Android folder not found."
            echo "Generating Android project..."

            flutter create . \
              --platforms=android \
              --org=com.schoolmanagement
          else
            echo "Android folder already exists."
          fi

      # 6. Install packages
      - name: Flutter Pub Get
        run: |
          cd "$APP_DIR"
          flutter pub get

      # 7. Analyze
      - name: Flutter Analyze
        run: |
          cd "$APP_DIR"
          flutter analyze

      # 8. Test
      - name: Flutter Test
        run: |
          cd "$APP_DIR"
          flutter test

      # 9. Build APK
      - name: Build Release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd "$APP_DIR"

          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://syspfaiggqoopcyrxqvg.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      # 10. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "================================"
          echo "APK BUILD SUCCESSFUL"
          echo "================================"

          ls -lh "$APK"

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
