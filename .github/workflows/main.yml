name: School Management APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . \
            -path './.git' -prune -o \
            -type f \
            -iname '*.zip' \
            -print | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            echo "Upload the School Management ZIP first."
            exit 1
          fi

          echo "ZIP FOUND:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf app_source
          mkdir -p app_source

          unzip -q "$ZIP_FILE" -d app_source

          echo "ZIP extracted."

      - name: Locate pubspec.yaml
        shell: bash
        run: |
          set -e

          PUBSPEC=$(find app_source \
            -type f \
            -name 'pubspec.yaml' \
            -print | head -n 1)

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml was not found inside ZIP."
            echo "Files found:"
            find app_source -maxdepth 3 -type f | head -100
            exit 1
          fi

          APP_DIR=$(dirname "$PUBSPEC")

          echo "Flutter project:"
          echo "$APP_DIR"

          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

      - name: Verify Flutter files
        shell: bash
        run: |
          set -e

          echo "Checking:"
          echo "$APP_DIR"

          if [ ! -f "$APP_DIR/pubspec.yaml" ]; then
            echo "ERROR: pubspec.yaml missing."
            exit 1
          fi

          if [ ! -f "$APP_DIR/lib/main.dart" ]; then
            echo "ERROR: lib/main.dart missing."
            echo ""
            echo "lib contents:"
            find "$APP_DIR/lib" -maxdepth 2 -type f 2>/dev/null || true
            exit 1
          fi

          echo "Flutter project is valid."

      - name: Prepare Android
        shell: bash
        run: |
          set -e

          cd "$APP_DIR"

          if [ ! -d android ]; then
            echo "Creating Android project..."
            flutter create . \
              --platforms=android \
              --org=com.schoolmanagement
          else
            echo "Android folder already exists."
          fi

      - name: Flutter Pub Get
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter pub get

      - name: Flutter Analyze
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter analyze

      - name: Flutter Test
        shell: bash
        run: |
          cd "$APP_DIR"
          flutter test

      - name: Build APK
        shell: bash
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          cd "$APP_DIR"

          flutter build apk --release \
            --dart-define=SUPABASE_URL=https://syspfaiggqoopcyrxqvg.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="$SUPABASE_PUBLISHABLE_KEY"

      - name: Verify APK
        shell: bash
        run: |
          APK="$APP_DIR/build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo "APK SUCCESSFULLY CREATED:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-management-release-apk
          path: ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
